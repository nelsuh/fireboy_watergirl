<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fire &amp; Water</title>
<link rel="stylesheet" href="style.css?v=5">
</head>

<body>

<div id="rot">
  <canvas id="board"></canvas>

  <!-- Touch controls (landscape): move on the left, jump on the right -->
  <div class="pad pad-left">
    <button class="ctl" id="btnLeft"  aria-label="left">◀</button>
    <button class="ctl" id="btnRight" aria-label="right">▶</button>
  </div>
  <div class="pad pad-right">
    <button class="ctl ctl-swap" id="btnSwap" aria-label="swap" hidden>⇄</button>
    <button class="ctl ctl-jump" id="btnJump" aria-label="jump">▲</button>
  </div>

  <!-- Quick chat (real 2-player rooms only, script.js) — bottom centre,
       between the move pad and the jump pad, inside the rotating stage -->
  <button class="chat-toggle" id="chatToggle" type="button" aria-label="Quick chat" aria-expanded="false" aria-controls="chatPicker" hidden>💬</button>
  <div class="chat-picker" id="chatPicker" aria-hidden="true">
    <div class="chat-picker-title" id="chatPickerTitle">Quick chat</div>
    <div class="chat-emojis" id="chatEmojis" role="group"></div>
    <div class="chat-phrases" id="chatPhrases"></div>
    <form class="custom-chat-form" id="customChatForm" hidden>
      <button class="custom-chat-back" id="customChatBack" type="button" aria-label="Back to quick chat">←</button>
      <input class="custom-chat-input" id="customChatInput" type="text" maxlength="60" autocomplete="off" autocorrect="off" enterkeyhint="send" aria-label="Type a message…" placeholder="Type a message…">
      <button class="custom-chat-send" id="customChatSend" type="submit">Send</button>
    </form>
  </div>
  <div class="reaction-layer" id="reactionLayer" aria-live="polite"></div>

  <!-- Overlays -->
  <div id="waitingOverlay" class="overlay" hidden>
    <div class="card">
      <div class="spinner"></div>
      <p id="waitingText">Waiting for your partner…</p>
      <button class="btn" id="soloBtn">Play solo instead</button>
    </div>
  </div>

  <div id="pauseOverlay" class="overlay" hidden>
    <div class="card">
      <div class="spinner"></div>
      <p id="pauseText">Reconnecting…</p>
    </div>
  </div>

  <div id="endOverlay" class="overlay" hidden>
    <div class="card">
      <div class="end-emoji" id="endEmoji">🏆</div>
      <h2 id="endTitle">You did it!</h2>
      <p id="endStats"></p>
      <button class="btn btn-primary" id="againBtn">Play again</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="https://usions.com/usion-sdk.js"></script>
<script src="maps.js?v=5"></script>
<script src="script.js?v=13"></script>

</body>
</html>
