<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fire &amp; Water</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="rot">
  <canvas id="board"></canvas>

  <div id="status"></div>

  <!-- Start card removed — the game auto-starts on load. Kept hidden so the
       (few) `$('start').style.display='none'` calls stay harmless no-ops. -->
  <div id="start" class="overlay" hidden>
    <div class="card">
      <div id="whoami"></div>
    </div>
  </div>

  <!-- Waiting for partner -->
  <div id="waitingOverlay" class="overlay" hidden>
    <div class="card">
      <div class="spinner"></div>
      <p id="waitingText">Waiting for your partner…</p>
    </div>
  </div>

  <!-- Reconnecting -->
  <div id="pauseOverlay" class="overlay" hidden>
    <div class="card">
      <div class="spinner"></div>
      <p id="pauseText">Reconnecting…</p>
    </div>
  </div>

  <!-- Victory -->
  <div id="endOverlay" class="overlay" hidden>
    <div class="card">
      <div class="end-emoji" id="endEmoji">🏆</div>
      <h2 id="endTitle">You did it!</h2>
      <p id="endStats"></p>
      <button class="btn btn-primary" id="againBtn">Play again</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<!-- Touch controls live OUTSIDE #rot so they stay in the phone's real (portrait)
     orientation instead of rotating 90° with the game into GameTok's swipe
     buttons. Move on the left, jump/switch on the right. -->
<div class="pad pad-left">
  <button class="ctl" id="btnLeft"  aria-label="left">◀</button>
  <button class="ctl" id="btnRight" aria-label="right">▶</button>
</div>
<div class="pad pad-right">
  <button class="ctl ctl-swap" id="btnSwap" aria-label="switch hero" hidden>⇄</button>
  <button class="ctl ctl-jump" id="btnJump" aria-label="jump">▲</button>
</div>

<!-- Portrait nudge: this is a landscape game, so ask the player to turn the phone
     sideways. Non-blocking (pointer-events:none) — the upright game still plays
     behind it in case the device can't rotate. Hidden in landscape. -->
<div id="rotateHint" hidden>↻&nbsp; Turn your phone sideways for full-screen play</div>

<script src="https://usions.com/usion-sdk.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
